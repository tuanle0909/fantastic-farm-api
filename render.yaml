# Render Blueprint — deploy from branch `production`.
# Dashboard: New → Blueprint → connect github.com/tuanle0909/fantastic-farm-api
#
# Before first deploy, add secrets in the Render service → Environment:
#   NODE_AUTH_TOKEN = GitHub PAT with read:packages (install @tuanle0909/fantastic-farm-shared)
# Plus all vars from .env.example (MONGODB_URL, JWT_SECRET, SUI_*, FANTASTIC_FARM_*, …).

services:
  - type: web
    name: fantastic-farm-api
    runtime: node
    region: singapore
    plan: free
    branch: production
    buildCommand: bash scripts/render-build.sh
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_AUTH_TOKEN
        sync: false
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUI_NETWORK
        sync: false
      - key: SUI_RPC_URL
        sync: false
      - key: FANTASTIC_FARM_MINT_SIGNING_PRIVATE_KEY_HEX
        sync: false
      - key: FANTASTIC_FARM_PACKAGE_ID
        sync: false
      - key: FANTASTIC_FARM_REGISTRY_OBJECT_ID
        sync: false
      - key: FANTASTIC_FARM_MARKETPLACE_OBJECT_ID
        sync: false
      - key: FANTASTIC_FARM_FC_MINT_REGISTRY_OBJECT_ID
        sync: false
      - key: STUDIO_FC_SWAP_ENABLED
        value: "false"
      - key: FANTASTIC_FARM_STUDIO_SWAP_PRIVATE_KEY_HEX
        sync: false
      - key: STUDIO_SWAP_SIGNER_EXPECTED_ADDRESS
        sync: false
      - key: STUDIO_FC_SWAP_INTERVAL_MS
        value: "3600000"
      - key: STUDIO_FC_SWAP_MIN_AMOUNT_MIST
        value: "1000000000"
